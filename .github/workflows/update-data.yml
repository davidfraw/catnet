name: Refresh TripSit data
on:
  schedule:
    - cron: "0 6 1 */3 *"   # 1st day of every 3rd month, 06:00 UTC
  workflow_dispatch: {}      # manual "Run workflow" button in the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keep old database for diff
        run: cp database.json /tmp/database.old.json

      - name: Fetch current TripSit combos
        run: curl -sfL "https://raw.githubusercontent.com/TripSit/drugs/master/combos.json" -o tripsit-combos.json

      - name: Rebuild database
        run: |
          python extract_tripsit.py
          python build_db.py

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- database.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version and rebuild app
        if: steps.diff.outputs.changed == 'true'
        run: |
          python - <<'PY'
          v = open("VERSION").read().strip().split(".")
          v[2] = str(int(v[2]) + 1)
          open("VERSION", "w").write(".".join(v) + "\n")
          PY
          python build_db.py
          python build_app.py
          cp catnet-install.html dist/
          python scripts/diff_report.py /tmp/database.old.json database.json /tmp/diff.md

      - name: Open review PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/tripsit-refresh
          title: "Data refresh: TripSit combos (v${{ github.run_number }})"
          body-path: /tmp/diff.md
          commit-message: "chore: refresh TripSit combo data"
          labels: data-update
